<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pixel & Pad: cultura gamer, consolas, videojuegos y periféricos."
    />
    <meta name="theme-color" content="#f5f0df" />
    <title>Pixel &amp; Pad — Tienda gamer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Arial", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --ink: #171717;
        --paper: #f5f0df;
        --acid: #c9f31d;
        --violet: #9c76ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background-color: var(--paper);
        background-image: radial-gradient(#17171713 1px, transparent 1px);
        background-position: -4px -4px;
        background-size: 18px 18px;
        color: var(--ink);
      }

      .site-header {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 100px;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
        padding: 18px clamp(20px, 6vw, 88px);
        border-bottom: 3px solid var(--ink);
        background: var(--paper);
        box-shadow: 0 7px 0 var(--ink);
      }

      .brand {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 12px;
        color: inherit;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 3px;
        transform: rotate(-6deg);
      }

      .brand-mark span {
        border: 2px solid var(--ink);
        background: var(--acid);
        box-shadow: 2px 2px 0 var(--ink);
      }

      .brand-mark span:nth-child(2),
      .brand-mark span:nth-child(4),
      .brand-mark span:nth-child(8) {
        background: var(--violet);
      }

      .brand-mark span:nth-child(5) {
        background: var(--ink);
      }

      .brand-name {
        font-size: clamp(1.25rem, 2.2vw, 1.8rem);
        font-weight: 950;
        letter-spacing: -0.075em;
        line-height: 0.9;
        white-space: nowrap;
      }

      .brand-name span {
        display: block;
        margin-top: 5px;
        color: #555044;
        font-family: "Courier New", monospace;
        font-size: 0.48em;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .main-nav {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: clamp(7px, 1.3vw, 18px);
      }

      .main-nav a {
        position: relative;
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border: 2px solid transparent;
        color: var(--ink);
        font-size: 0.91rem;
        font-weight: 850;
        text-decoration: none;
        transition:
          background-color 140ms ease,
          border-color 140ms ease,
          box-shadow 140ms ease,
          transform 140ms ease;
      }

      .main-nav a:hover,
      .main-nav a:focus-visible {
        border-color: var(--ink);
        background: var(--acid);
        box-shadow: 3px 3px 0 var(--ink);
        outline: none;
        transform: translate(-2px, -2px);
      }

      .main-nav a[aria-current="page"] {
        border-color: var(--ink);
        background: var(--violet);
        box-shadow: 3px 3px 0 var(--ink);
      }

      .main-nav a[aria-current="page"]:hover,
      .main-nav a[aria-current="page"]:focus-visible {
        background: var(--acid);
      }

      @media (max-width: 720px) {
        .site-header {
          min-height: 0;
          align-items: flex-start;
          flex-direction: column;
          gap: 22px;
          padding: 20px clamp(18px, 5vw, 32px) 18px;
        }

        .main-nav {
          width: 100%;
          justify-content: flex-start;
          gap: 8px;
          overflow-x: auto;
          padding: 0 3px 5px;
          scrollbar-width: thin;
        }

        .main-nav a {
          min-height: 40px;
          flex: 0 0 auto;
          padding: 0 11px;
          font-size: 0.85rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#inicio" aria-label="Pixel & Pad, ir al inicio">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </span>
        <span class="brand-name">Pixel &amp; Pad<span>Game store</span></span>
      </a>

      <nav class="main-nav" aria-label="Navegación principal">
        <a href="#inicio" aria-current="page">Inicio</a>
        <a href="#consolas">Consolas</a>
        <a href="#videojuegos">Videojuegos</a>
        <a href="#perifericos">Periféricos</a>
      </nav>
    </header>
  </body>
</html>
