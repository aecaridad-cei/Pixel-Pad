<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pixel & Pad: cultura gamer, consolas, videojuegos y periféricos."
    />
    <meta name="theme-color" content="#f5f0df" />
    <title>Pixel &amp; Pad — Tienda gamer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Arial", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --ink: #171717;
        --paper: #f5f0df;
        --acid: #c9f31d;
        --violet: #9c76ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background-color: var(--paper);
        background-image: radial-gradient(#17171713 1px, transparent 1px);
        background-position: -4px -4px;
        background-size: 18px 18px;
        color: var(--ink);
      }

      .site-header {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 100px;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
        padding: 18px clamp(20px, 6vw, 88px);
        border-bottom: 3px solid var(--ink);
        background: var(--paper);
        box-shadow: 0 7px 0 var(--ink);
      }

      .brand {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 12px;
        color: inherit;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 3px;
        transform: rotate(-6deg);
      }

      .brand-mark span {
        border: 2px solid var(--ink);
        background: var(--acid);
        box-shadow: 2px 2px 0 var(--ink);
      }

      .brand-mark span:nth-child(2),
      .brand-mark span:nth-child(4),
      .brand-mark span:nth-child(8) {
        background: var(--violet);
      }

      .brand-mark span:nth-child(5) {
        background: var(--ink);
      }

      .brand-name {
        font-size: clamp(1.25rem, 2.2vw, 1.8rem);
        font-weight: 950;
        letter-spacing: -0.075em;
        line-height: 0.9;
        white-space: nowrap;
      }

      .brand-name span {
        display: block;
        margin-top: 5px;
        color: #555044;
        font-family: "Courier New", monospace;
        font-size: 0.48em;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .main-nav {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: clamp(7px, 1.3vw, 18px);
      }

      .main-nav a {
        position: relative;
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border: 2px solid transparent;
        color: var(--ink);
        font-size: 0.91rem;
        font-weight: 850;
        text-decoration: none;
        transition:
          background-color 140ms ease,
          border-color 140ms ease,
          box-shadow 140ms ease,
          transform 140ms ease;
      }

      .main-nav a:hover,
      .main-nav a:focus-visible {
        border-color: var(--ink);
        background: var(--acid);
        box-shadow: 3px 3px 0 var(--ink);
        outline: none;
        transform: translate(-2px, -2px);
      }

      .main-nav a[aria-current="page"] {
        border-color: var(--ink);
        background: var(--violet);
        box-shadow: 3px 3px 0 var(--ink);
      }

      .main-nav a[aria-current="page"]:hover,
      .main-nav a[aria-current="page"]:focus-visible {
        background: var(--acid);
      }

      .hero {
        display: grid;
        min-height: min(760px, calc(100svh - 110px));
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        align-items: center;
        gap: clamp(32px, 6vw, 88px);
        overflow: hidden;
        padding: 64px clamp(24px, 8vw, 120px) 76px;
      }

      .hero-copy {
        position: relative;
        z-index: 1;
        max-width: 670px;
      }

      .hero-kicker {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 24px;
        padding: 8px 12px;
        border: 2px solid var(--ink);
        background: var(--acid);
        box-shadow: 3px 3px 0 var(--ink);
        font-family: "Courier New", monospace;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transform: rotate(-2deg);
      }

      .hero-kicker::before {
        width: 9px;
        height: 9px;
        border: 2px solid var(--ink);
        background: var(--violet);
        content: "";
      }

      .hero h1 {
        max-width: 690px;
        margin: 0;
        font-size: clamp(3.2rem, 7.3vw, 6.7rem);
        font-weight: 950;
        letter-spacing: -0.085em;
        line-height: 0.91;
      }

      .hero h1 span {
        display: block;
        color: var(--violet);
        -webkit-text-stroke: 2px var(--ink);
        text-shadow: 4px 4px 0 var(--ink);
      }

      .hero-description {
        max-width: 460px;
        margin: 27px 0 30px;
        color: #48443c;
        font-size: clamp(1rem, 1.5vw, 1.16rem);
        font-weight: 600;
        line-height: 1.65;
      }

      .hero-cta {
        display: inline-flex;
        min-height: 58px;
        align-items: center;
        justify-content: center;
        gap: 17px;
        padding: 0 20px;
        border: 3px solid var(--ink);
        background: var(--acid);
        box-shadow: 5px 5px 0 var(--ink);
        color: var(--ink);
        font-size: 0.95rem;
        font-weight: 900;
        text-decoration: none;
        transition:
          background-color 140ms ease,
          box-shadow 140ms ease,
          transform 140ms ease;
      }

      .hero-cta:hover,
      .hero-cta:focus-visible {
        background: var(--violet);
        box-shadow: 2px 2px 0 var(--ink);
        outline: none;
        transform: translate(3px, 3px);
      }

      .hero-cta span {
        font-size: 1.4rem;
        line-height: 1;
      }

      .hero-art {
        position: relative;
        display: grid;
        min-height: 410px;
        place-items: center;
        isolation: isolate;
      }

      .hero-art::before {
        position: absolute;
        z-index: -1;
        width: min(100%, 430px);
        aspect-ratio: 1;
        border: 3px solid var(--ink);
        background-color: var(--violet);
        background-image: radial-gradient(var(--ink) 1.5px, transparent 1.5px);
        background-position: 8px 8px;
        background-size: 19px 19px;
        box-shadow: 10px 10px 0 var(--ink);
        content: "";
        transform: rotate(4deg);
      }

      .hero-controller {
        width: min(100%, 470px);
        overflow: visible;
        filter: drop-shadow(7px 9px 0 var(--ink));
        transform: rotate(-8deg);
      }

      .hero-sticker {
        position: absolute;
        top: 10%;
        right: 2%;
        display: grid;
        width: 88px;
        aspect-ratio: 1;
        place-items: center;
        border: 3px solid var(--ink);
        background: var(--acid);
        box-shadow: 4px 4px 0 var(--ink);
        font-family: "Courier New", monospace;
        font-size: 1.4rem;
        font-weight: 900;
        transform: rotate(9deg);
      }

      .hero-pixel {
        position: absolute;
        width: 19px;
        height: 19px;
        border: 2px solid var(--ink);
        background: var(--acid);
        box-shadow: 3px 3px 0 var(--ink);
      }

      .hero-pixel-one {
        top: 18%;
        left: 3%;
      }

      .hero-pixel-two {
        right: 8%;
        bottom: 12%;
        width: 13px;
        height: 13px;
        background: var(--violet);
      }

      @media (max-width: 720px) {
        .site-header {
          min-height: 0;
          align-items: flex-start;
          flex-direction: column;
          gap: 22px;
          padding: 20px clamp(18px, 5vw, 32px) 18px;
        }

        .main-nav {
          width: 100%;
          justify-content: flex-start;
          gap: 8px;
          overflow-x: auto;
          padding: 0 3px 5px;
          scrollbar-width: thin;
        }

        .hero {
          min-height: 0;
          grid-template-columns: 1fr;
          gap: 20px;
          padding: 54px clamp(22px, 7vw, 48px) 64px;
        }

        .hero-copy {
          max-width: 620px;
        }

        .hero h1 {
          font-size: clamp(3.35rem, 12vw, 5.4rem);
        }

        .hero-art {
          width: min(100%, 500px);
          min-height: 350px;
          justify-self: center;
        }

        .hero-art::before {
          width: min(84%, 350px);
        }

        .hero-controller {
          width: min(100%, 400px);
        }

        .hero-sticker {
          top: 4%;
          right: 4%;
          width: 72px;
          font-size: 1.15rem;
        }

        .main-nav a {
          min-height: 40px;
          flex: 0 0 auto;
          padding: 0 11px;
          font-size: 0.85rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#inicio" aria-label="Pixel & Pad, ir al inicio">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </span>
        <span class="brand-name">Pixel &amp; Pad<span>Game store</span></span>
      </a>

      <nav class="main-nav" aria-label="Navegación principal">
        <a href="#inicio" aria-current="page">Inicio</a>
        <a href="#consolas">Consolas</a>
        <a href="#videojuegos">Videojuegos</a>
        <a href="#perifericos">Periféricos</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="inicio" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="hero-kicker">Tu próxima partida empieza aquí</p>
          <h1 id="hero-title">Equipa tu Setup <span>al siguiente nivel</span></h1>
          <p class="hero-description">
            Bienvenido a Pixel &amp; Pad: encuentra consolas, videojuegos y todo
            lo que necesitas para jugar a tu manera.
          </p>
          <a class="hero-cta" href="#ofertas-semana">
            Ver ofertas de la semana <span aria-hidden="true">→</span>
          </a>
        </div>

        <div class="hero-art">
          <span class="hero-pixel hero-pixel-one" aria-hidden="true"></span>
          <span class="hero-pixel hero-pixel-two" aria-hidden="true"></span>
          <span class="hero-sticker" aria-hidden="true">GG!</span>
          <svg
            class="hero-controller"
            viewBox="0 0 480 320"
            role="img"
            aria-labelledby="controller-title controller-description"
          >
            <title id="controller-title">Control gamer Pixel &amp; Pad</title>
            <desc id="controller-description">
              Ilustración de un mando amarillo con botones violetas sobre un
              fondo de puntos estilo cómic.
            </desc>
            <path
              d="M151 64c-23 0-42 16-49 39L54 224c-8 26 19 47 42 32l61-40h166l61 40c23 15 50-6 42-32L378 103c-7-23-26-39-49-39H151Z"
              fill="#c9f31d"
              stroke="#171717"
              stroke-width="9"
              stroke-linejoin="round"
            />
            <path
              d="M106 111h58v19h19v58h-19v19h-58v-19H87v-58h19z"
              fill="#f5f0df"
              stroke="#171717"
              stroke-width="7"
              stroke-linejoin="round"
            />
            <path
              d="M136 125v68m-34-34h68"
              stroke="#171717"
              stroke-width="9"
              stroke-linecap="square"
            />
            <circle cx="306" cy="127" r="20" fill="#9c76ff" stroke="#171717" stroke-width="7" />
            <circle cx="348" cy="169" r="20" fill="#ff6d59" stroke="#171717" stroke-width="7" />
            <circle cx="264" cy="169" r="20" fill="#f5f0df" stroke="#171717" stroke-width="7" />
            <circle cx="306" cy="211" r="20" fill="#171717" stroke="#171717" stroke-width="7" />
            <path d="M202 135h25m-25 16h25m26 0h8" stroke="#171717" stroke-width="8" stroke-linecap="round" />
            <path d="M177 239c16 18 37 26 63 26s47-8 63-26" fill="none" stroke="#171717" stroke-width="7" stroke-linecap="round" />
          </svg>
        </div>
      </section>
    </main>
  </body>
</html>
